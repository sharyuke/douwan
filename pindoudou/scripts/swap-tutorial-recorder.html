<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>换色教程录制</title>
  <style>
    html,body{margin:0;background:#000;overflow:hidden}
    canvas{display:block}
  </style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
/* 把工作台截图串成一支短教程：画面上的大字是解说，音轨是轻快背景音乐。 */
const W = 960
const H = 540
const BAR = 118
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
window.__recorderState = 'boot'

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => resolve(img)
    img.onerror = () => reject(new Error('截图加载失败 ' + url))
    img.src = url
  })
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}

/* 整张截图放进画面区，不裁掉工具轨。返回实际画出的矩形，方便把格子坐标换算回来。 */
function fitContain(img, x, y, w, h) {
  const ir = img.width / img.height
  const r = w / h
  let dw, dh, dx, dy
  if (ir > r) {
    dw = w
    dh = w / ir
    dx = x
    dy = y + (h - dh) / 2
  } else {
    dh = h
    dw = h * ir
    dy = y
    dx = x + (w - dw) / 2
  }
  ctx.drawImage(img, dx, dy, dw, dh)
  return { dx, dy, dw, dh }
}

function ease(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
}

function drawCursor(x, y, click) {
  ctx.save()
  ctx.translate(x, y)
  ctx.fillStyle = '#1A2D22'
  ctx.beginPath()
  ctx.moveTo(0, 0)
  ctx.lineTo(0, 22)
  ctx.lineTo(6, 17)
  ctx.lineTo(11, 26)
  ctx.lineTo(15, 24)
  ctx.lineTo(10, 15)
  ctx.lineTo(18, 15)
  ctx.closePath()
  ctx.fill()
  ctx.strokeStyle = '#fff'
  ctx.lineWidth = 1.6
  ctx.stroke()
  if (click) {
    ctx.beginPath()
    ctx.arc(4, 8, 16, 0, Math.PI * 2)
    ctx.strokeStyle = 'rgba(200,230,60,.95)'
    ctx.lineWidth = 3
    ctx.stroke()
  }
  ctx.restore()
}

function drawFrame(cfg, images, t) {
  let acc = 0
  let seg = cfg.segments[cfg.segments.length - 1]
  let local = seg.dur
  for (const s of cfg.segments) {
    if (t < acc + s.dur) { seg = s; local = t - acc; break }
    acc += s.dur
  }
  const p = Math.min(1, local / seg.dur)
  ctx.fillStyle = '#E7EEE4'
  ctx.fillRect(0, 0, W, H)
  /* 解说条放在画面上方，避免被播放器底部的控制条盖住 */
  const areaH = H - BAR
  const boxA = fitContain(images[seg.a], 0, BAR, W, areaH)
  const fade = p < 0.46 ? 0 : Math.min(1, (p - 0.46) / 0.18)
  if (fade > 0 && seg.b && images[seg.b]) {
    ctx.save()
    ctx.globalAlpha = fade
    fitContain(images[seg.b], 0, BAR, W, areaH)
    ctx.restore()
  }
  if (seg.highlight && fade < 0.85) {
    const h = seg.highlight
    const x = boxA.dx + h.x * boxA.dw
    const y = boxA.dy + h.y * boxA.dh
    const w = h.w * boxA.dw
    const hh = h.h * boxA.dh
    ctx.save()
    ctx.globalAlpha = 1 - fade
    ctx.strokeStyle = '#1A2D22'
    ctx.lineWidth = 3
    roundRect(x - 3, y - 3, w + 6, hh + 6, 10)
    ctx.stroke()
    ctx.fillStyle = 'rgba(200,230,60,.28)'
    ctx.fill()
    ctx.restore()
  }
  if (seg.cursor) {
    const c = seg.cursor
    const u = ease(Math.min(1, p / 0.4))
    const fx = c.fromX + (c.x - c.fromX) * u
    const fy = c.fromY + (c.y - c.fromY) * u
    const box = fade > 0.5 && seg.b ? boxA : boxA
    drawCursor(box.dx + fx * box.dw, box.dy + fy * box.dh, p > 0.4 && p < 0.62)
  }
  ctx.fillStyle = '#1A2D22'
  ctx.fillRect(0, 0, W, BAR)
  ctx.fillStyle = '#C8E63C'
  roundRect(28, 16, 8, 8, 2)
  ctx.fill()
  ctx.fillStyle = '#C8E63C'
  ctx.font = '600 14px "Microsoft YaHei", "PingFang SC", sans-serif'
  ctx.textBaseline = 'middle'
  ctx.fillText('换色教程', 44, 20)
  ctx.fillStyle = '#FFFFFF'
  ctx.font = '700 28px "Microsoft YaHei", "PingFang SC", sans-serif'
  ctx.fillText(seg.title, 28, 58)
  ctx.fillStyle = 'rgba(255,255,255,.86)'
  ctx.font = '400 18px "Microsoft YaHei", "PingFang SC", sans-serif'
  ctx.fillText(seg.sub, 28, 92)
}

function scheduleMusic(actx, dest, seconds) {
  const master = actx.createGain()
  const analyser = actx.createAnalyser()
  analyser.fftSize = 256
  master.connect(analyser)
  analyser.connect(dest)
  const t0 = actx.currentTime + 0.05
  master.gain.setValueAtTime(0.0001, t0)
  master.gain.linearRampToValueAtTime(0.62, t0 + 1.1)
  master.gain.setValueAtTime(0.62, t0 + Math.max(1.2, seconds - 1.8))
  master.gain.linearRampToValueAtTime(0.0001, t0 + seconds)
  const scale = [60, 64, 67, 72, 76, 72, 67, 64, 65, 69, 72, 77, 72, 69, 67, 64]
  const step = 60 / 104 / 2
  for (let i = 0; i < Math.ceil(seconds / step) + 2; i++) {
    const midi = scale[i % scale.length] + (i % 32 > 23 ? 12 : 0)
    const freq = 440 * Math.pow(2, (midi - 69) / 12)
    const t = t0 + i * step
    if (t > t0 + seconds) break
    const osc = actx.createOscillator()
    const gain = actx.createGain()
    osc.type = i % 4 === 0 ? 'triangle' : 'sine'
    osc.frequency.value = freq
    gain.gain.setValueAtTime(0.0001, t)
    gain.gain.exponentialRampToValueAtTime(i % 4 === 0 ? 0.34 : 0.22, t + 0.02)
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42)
    osc.connect(gain)
    gain.connect(master)
    osc.start(t)
    osc.stop(t + 0.46)
  }
  const bassNotes = [48, 48, 43, 41]
  const beat = 60 / 104
  for (let i = 0; i < Math.ceil(seconds / beat); i++) {
    const midi = bassNotes[i % bassNotes.length]
    const freq = 440 * Math.pow(2, (midi - 69) / 12)
    const t = t0 + i * beat
    if (t > t0 + seconds) break
    const osc = actx.createOscillator()
    const gain = actx.createGain()
    osc.type = 'sine'
    osc.frequency.value = freq
    gain.gain.setValueAtTime(0.0001, t)
    gain.gain.exponentialRampToValueAtTime(0.16, t + 0.03)
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5)
    osc.connect(gain)
    gain.connect(master)
    osc.start(t)
    osc.stop(t + 0.52)
  }
  const data = new Uint8Array(analyser.frequencyBinCount)
  let peak = 0
  const timer = setInterval(() => {
    analyser.getByteTimeDomainData(data)
    for (let i = 0; i < data.length; i++) {
      const v = Math.abs(data[i] - 128) / 128
      if (v > peak) peak = v
    }
    window.__audioPeak = peak
  }, 80)
  return () => clearInterval(timer)
}

async function main() {
  const cfg = await (await fetch('/__config?t=' + Date.now())).json()
  const images = {}
  for (const name of cfg.images) images[name] = await loadImage('/__shots/' + name + '.png?t=' + Date.now())
  const seconds = cfg.segments.reduce((a, s) => a + s.dur, 0)
  drawFrame(cfg, images, 0.4)
  window.__posterB64 = canvas.toDataURL('image/png').split(',')[1]
  const stream = canvas.captureStream(30)
  const actx = new AudioContext()
  await actx.resume()
  const dest = actx.createMediaStreamDestination()
  const stopMeter = scheduleMusic(actx, dest, seconds)
  const mixed = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()])
  const candidates = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ]
  const mime = candidates.find(m => MediaRecorder.isTypeSupported(m)) || ''
  const rec = new MediaRecorder(mixed, mime ? { mimeType: mime, videoBitsPerSecond: 2800000, audioBitsPerSecond: 128000 } : { videoBitsPerSecond: 2800000 })
  const chunks = []
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data) }
  const stopped = new Promise(resolve => { rec.onstop = resolve })
  rec.start(200)
  window.__recorderMeta = { mime: mime || rec.mimeType, seconds }
  const t0 = performance.now()
  await new Promise(resolve => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000
      drawFrame(cfg, images, Math.min(t, seconds - 0.04))
      if (t >= seconds + 0.15) return resolve()
      requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)
  })
  rec.stop()
  await stopped
  stopMeter()
  try { actx.close() } catch { /* 已经停了 */ }
  const blob = new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' })
  const buf = new Uint8Array(await blob.arrayBuffer())
  let binary = ''
  const slice = 0x8000
  for (let i = 0; i < buf.length; i += slice) {
    binary += String.fromCharCode.apply(null, buf.subarray(i, i + slice))
  }
  const b64 = btoa(binary)
  const parts = []
  const size = 120000
  for (let i = 0; i < b64.length; i += size) parts.push(b64.slice(i, i + size))
  window.__videoChunks = parts
  window.__recorderMime = rec.mimeType || mime || ''
  window.__recorderState = 'done'
}

main().catch(err => {
  window.__recorderError = String(err && err.stack || err)
  window.__recorderState = 'error'
})
</script>
</body>
</html>
