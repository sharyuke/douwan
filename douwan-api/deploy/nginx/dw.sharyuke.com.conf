# 豆玩 DOUWAN · 前端静态站点 + 后端 API 反向代理
upstream douwan_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    server_name dw.sharyuke.com;

    root /var/www/dw.sharyuke.com;
    index index.html;
    charset utf-8;

    client_max_body_size 20m;

    access_log /var/log/nginx/dw.sharyuke.com.access.log;
    error_log  /var/log/nginx/dw.sharyuke.com.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 后端 API（保持 /api 前缀，与 gin 路由一致）----
    location /api/ {
        proxy_pass http://douwan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # ---- 健康检查直通后端 ----
    location = /healthz { proxy_pass http://douwan_api/healthz; access_log off; }
    location = /readyz  { proxy_pass http://douwan_api/readyz;  access_log off; }

    # ---- 后台素材上传的图片 ----
    # 由 nginx 直接读磁盘，比走后端再回传快得多。
    # 这个目录必须与 storage.upload_dir 指向同一个路径。
    location /uploads/ {
        alias /var/lib/douwan/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 上传目录里不可能有脚本，禁止执行更安全
        location ~* \.(php|jsp|asp|sh|cgi)$ { deny all; }
        try_files $uri =404;
    }

    # ---- 前端：带 hash 的产物可以长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则发版后用户拿到旧入口
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # hash 路由，try_files 只是兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dw.sharyuke.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dw.sharyuke.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dw.sharyuke.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dw.sharyuke.com;
    return 404; # managed by Certbot


}