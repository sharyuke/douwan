# 开机时确保 DOUWAN 的持久化目录存在且属主正确。
#
# 为什么需要它：systemd 单元的 ReadWritePaths=/var/lib/douwan/uploads 在目录不存在时
# 会让服务以 226/NAMESPACE 启动失败（namespace 建立早于 ExecStartPre），
# 而 /var/lib/douwan 是 root:root 755，服务用户自己建不了子目录。
# 安装方式：
#   install -m 644 deploy/systemd/douwan-tmpfiles.conf /etc/tmpfiles.d/douwan.conf
#   systemd-tmpfiles --create /etc/tmpfiles.d/douwan.conf
d /var/lib/douwan 0755 root root -
d /var/lib/douwan/uploads 0755 douwan douwan -
